# プレゼンシート（promote/）の曲・アイドルデータを ふじわらはじめAPI から取り直す。
# - 定期実行はしない（必要なときに Actions 画面から手動で実行する。手動実行は develop にこのファイルが必要）
#   ※ 手元で python scripts/fetch_data.py を実行して commit しても同じ
# - 更新は公開ブランチ（release）に commit するので、Cloudflare に自動で反映される
#   ※ release に直接 commit されるため、develop へは必要に応じて release をマージして取り込む
name: Update promote song data

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: release

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promote
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from fujiwarahaji API
        run: python scripts/fetch_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/songs data/idols
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git add data/meta.json
            git commit -m "data: update promote song data from fujiwarahaji"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
          fi
