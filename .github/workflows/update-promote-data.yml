# プレゼンシート（promote/）の曲・アイドルデータを ふじわらはじめAPI から毎週更新する。
# - スケジュール実行は「デフォルトブランチ（develop）にあるこのファイル」が動く
# - 更新は公開ブランチ（release）に commit するので、Cloudflare Pages に自動で反映される
#   ※ release に直接 commit されるため、develop へは必要に応じて release をマージして取り込む
name: Update promote song data

on:
  schedule:
    - cron: "30 19 * * 0"   # 毎週月曜 4:30 JST（ふじわらはじめ側が空いている早朝帯）
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: release

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promote
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from fujiwarahaji API
        run: python scripts/fetch_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/songs data/idols
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git add data/meta.json
            git commit -m "data: update promote song data from fujiwarahaji"
            git push origin HEAD:${{ env.TARGET_BRANCH }}
          fi
