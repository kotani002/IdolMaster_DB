<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アイドルマスター衣装図鑑</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site">
    <h1><a href="index.html">アイドルマスター衣装図鑑</a></h1>
    <p>見た目と名前が一致しない衣装を、タグで探せる非公式ファンサイトです。</p>
  </header>

  <main id="app">
    <section class="filter" aria-label="絞り込み">
      <h2>タグで絞り込み</h2>
      <div class="row">
        <input id="search" type="search" placeholder="衣装名・アイドル名・ライブ名・楽曲名で検索">
        <button id="clear" class="btn" type="button">条件をクリア</button>
      </div>
      <div id="chips" class="chips"></div>
    </section>

    <p id="count" class="count"></p>
    <div id="grid" class="grid"></div>
  </main>

  <footer>
    <p>当サイトは非公式のファンサイトです。画像・名称の権利は各権利者に帰属します。</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
